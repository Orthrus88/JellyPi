name: Validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: shellcheck scripts/*.sh tests/*.sh
      - run: docker compose --env-file .env.example config >/dev/null
      - run: docker compose --env-file .env.example --profile usenet config >/dev/null
      - run: docker compose --env-file .env.example --profile audiobooks config >/dev/null
      - run: docker compose --env-file .env.example --profile usenet --profile audiobooks config >/dev/null
      - run: docker compose --env-file .env.nvenc.example -f compose.yaml -f compose.nvenc.yaml config >/dev/null
      - run: docker compose --env-file .env.example build encoder torrent-cleanup
      - run: bash tests/smoke_encoder.sh
