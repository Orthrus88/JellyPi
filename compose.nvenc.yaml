services:
  encoder:
    container_name: media-encoder-nvenc
    environment:
      WORKER_NAME: desktop-gpu
      STATUS_FILE: status-desktop-gpu.json
      VIDEO_ENCODER: h264_nvenc
      NVIDIA_DRIVER_CAPABILITIES: video,utility,compute
      NVENC_PRESET: ${NVENC_PRESET:-p4}
      NVENC_CQ: ${NVENC_CQ:-23}
      PREFERRED_WORKER_STATUS: ""
    volumes:
      - type: bind
        source: ${GPU_MEDIA_ROOT:?Set GPU_MEDIA_ROOT to the media mount on this computer}
        target: /media
    cpus: ${NVENC_CPU_LIMIT:-4.0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
